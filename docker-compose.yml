version: '3.8'

services:
  llm:
    build:
      context: ../medaudit-LLM
      dockerfile: Dockerfile
    container_name: medaudit-llm
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medaudit-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-3pvpr8d33geggpfe4g9pp59bag}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-us-east-1_AGnzXU1mW}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-medaudit-bills-580739833421-us-east-1-dev}
      - LLM_MICROSERVICE_URL=http://llm:8001/api/v1/audit
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
